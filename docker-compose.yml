version: '3.8'

services:
  financeai:
    build:
      context: .
      dockerfile: Dockerfile
    image: financeai:latest
    container_name: financeai_app
    restart: unless-stopped
    ports:
      - "7860:7860"
      - "8000:7860"
    environment:
      - APP_ENV=production
      - PORT=7860
      - CORS_ORIGINS=["http://localhost:7860","http://localhost:8000","http://localhost:5173","http://127.0.0.1:7860"]
      - DATABASE_URL=sqlite:///./financeai.db
      - LLM_PROVIDER=mock
    volumes:
      - financeai_data:/app/backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  financeai_data:
